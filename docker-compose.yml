version: '3.8'

services:
  app:
    container_name: nest-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mailing_db?schema=public
      - NODE_OPTIONS=--max-old-space-size=4096
      - GO_MAILING_WORKER_URL=http://go-mailing-worker:8080
    depends_on:
      - postgres
      - go-mailing-worker
    networks:
      - app-network
    restart: unless-stopped
    # Wait for database to be ready before starting the app
    command: >
      sh -c "npx prisma migrate deploy && npm run start"
    volumes:
      - ./uploads:/app/uploads
    dns:
      - 8.8.8.8
      - 1.1.1.1

  postgres:
    container_name: postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mailing_db
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: redis
    # ports:
    #   - "6379:6379"
    networks:
      - app-network
    restart: unless-stopped

  telethon-api:
    container_name: telethon-api
    build:
      context: ./telethon
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - app-network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  go-mailing-worker:
    container_name: go-mailing-worker
    build:
      context: ./go-mailing-worker
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - PORT=8080
      - MAIN_SERVICE_URL=http://nest-app:3000/api/v1
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./uploads:/app/uploads


networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data: