name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run lint:security
      - run: npm audit --omit=dev --audit-level=high

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-mailing-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-mailing-worker/go.mod
          cache-dependency-path: go-mailing-worker/go.sum
      - run: go test ./...
